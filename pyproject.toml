[project]
name = "iptv-validators"
version = "0.1.0"
description = "Lightweight CLI toolkit for validating IPTV stream endpoints, HLS playlists, and M3U playlists."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "chekamarue" }]
dependencies = [
    "httpx>=0.27.0,<0.28",
    "pydantic>=2.7.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0",
    "pytest-asyncio>=0.23.0,<1.0",
    "pytest-cov>=4.1.0,<5.0",
    "ruff>=0.4.0,<1.0",
]

[project.scripts]
iptv-validators = "iptv_validators.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["iptv_validators*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
