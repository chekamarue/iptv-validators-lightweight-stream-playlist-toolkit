name: CI

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]
    - name: Lint with Ruff
      run: |
        ruff check .
    - name: Run tests with pytest
      run: |
        pytest

  docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
    - uses: actions/checkout@v4
    - name: Build Docker image
      run: docker build -t chekamarue/iptv-validators:ci .
    - name: Push to Docker Hub
      if: github.event_name == 'push'
      run: |
        echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
        docker tag chekamarue/iptv-validators:ci chekamarue/iptv-validators:${{ startsWith(github.ref, 'refs/tags/v') && format('{0}', replace(github.ref, 'refs/tags/', '')) || 'latest' }}
        docker push chekamarue/iptv-validators:${{ startsWith(github.ref, 'refs/tags/v') && format('{0}', replace(github.ref, 'refs/tags/', '')) || 'latest' }}
